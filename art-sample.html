<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Art sample</title>
<style>
  html, body { margin: 0; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", Nunito, system-ui, sans-serif;
    color: #5a3d5c;
    background: #fff6fa;
  }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }
  img { display: block; width: 100%; height: 100%; object-fit: contain; }

  /* Contact sheet. The screenshot clips this element. */
  #sheet { width: 1400px; box-sizing: border-box; padding: 22px 22px 26px;
    background:
      radial-gradient(circle at 12% 8%, #fff 0 18%, transparent 19%),
      linear-gradient(160deg, #ffe0ec, #e6ddff); }
  #sheet header { margin: 0 0 14px; }
  #sheet h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  #sheet .sub { margin: 4px 0 0; font-size: 16px; font-weight: 700; }
  #sheet .grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .card { width: 442px; box-sizing: border-box; background: #fff; border: 4px solid #5a3d5c; border-radius: 22px; padding: 10px 12px 12px; }
  .card h2 { margin: 0; text-align: center; font-size: 22px; }
  .card .kind { margin: 0 0 6px; text-align: center; font-size: 12px; font-weight: 700; opacity: .55; }
  .pair { display: flex; gap: 10px; justify-content: center; }
  figure { margin: 0; width: 196px; }
  figcaption { text-align: center; font-weight: 800; font-size: 14px; margin-top: 4px; }
  .art { height: 188px; box-sizing: border-box; padding: 8px; border-radius: 16px; position: relative;
    background: linear-gradient(#e8b98a, #e8b98a) bottom / 100% 24% no-repeat, #ffd6e0; }
  .night figure.after .art::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: rgba(58, 48, 130, .22); }

  /* Portrait room comparison, exactly the iPad frame. */
  #shot { width: 820px; height: 1180px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column;
    padding: 12px 16px 12px;
    background:
      radial-gradient(circle at 15% 10%, #fff6fa 0 20%, transparent 21%),
      radial-gradient(circle at 90% 85%, #fff6fa 0 15%, transparent 16%),
      linear-gradient(160deg, #ffe0ec, #e6ddff); }
  #shot header { flex: none; height: 46px; }
  #shot h1 { margin: 0; font-size: 22px; line-height: 26px; }
  #shot .sub { margin: 0; font-size: 13px; font-weight: 700; line-height: 18px; }
  #shot .block { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #shot h2 { flex: none; margin: 0 0 4px; font-size: 15px; line-height: 18px; }
  .frame { flex: 1; min-height: 0; border: 6px solid #5a3d5c; border-radius: 28px; overflow: hidden; background: #fff;
    display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .scaler { position: relative; overflow: hidden; }
  .world { position: absolute; left: 0; top: 0; }
  .wall { position: absolute; left: 0; right: 0; top: 0; height: 390px; }
  .wall.dots { background-image: radial-gradient(circle, rgba(255,255,255,.55) 7px, transparent 8px); background-size: 44px 44px; }
  .wall.stripes { background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.4) 0 26px, transparent 26px 52px); }
  .floor { position: absolute; left: 0; right: 0; top: 390px; bottom: 0;
    background-image: repeating-linear-gradient(90deg, rgba(90,61,92,.08) 0 3px, transparent 3px 125px), linear-gradient(rgba(0,0,0,.06), transparent 50%); }
  .baseboard { position: absolute; left: 0; right: 0; top: 380px; height: 16px; background: #fff; border-top: 4px solid #5a3d5c; border-bottom: 4px solid #5a3d5c; box-sizing: border-box; }
  .layer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  .piece { position: absolute; }

  #bench { width: 720px; padding: 24px; font-size: 16px; font-weight: 700; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./src/art/sample-page.ts"></script>
</body>
</html>
