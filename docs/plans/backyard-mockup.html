<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backyard mockup</title>
<style>
  :root { --ink: #5a3d5c; --bg: #ffe9f0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", Nunito, "Varela Round", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 15% 10%, #fff6fa 0 20%, transparent 21%),
                radial-gradient(circle at 90% 85%, #fff6fa 0 15%, transparent 16%),
                linear-gradient(160deg, #ffe0ec, #e6ddff);
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; }
  #app { height: 100%; display: flex; flex-direction: column; padding: 8px 10px 10px; }
  .top { display: flex; align-items: center; gap: 8px; padding: 2px 4px 6px; min-height: 52px; }
  .tabs { display: flex; gap: 6px; min-width: 0; }
  .tab {
    padding: 8px 12px; border-radius: 22px; background: #fff; font-weight: 800; font-size: 15px;
    box-shadow: 0 4px 0 #e6c9d8; border: 3px solid transparent; white-space: nowrap; min-height: 44px;
    display: flex; align-items: center;
  }
  .tab.on { background: #ff8fab; color: #fff; border-color: var(--ink); box-shadow: 0 4px 0 rgba(90,61,92,.35); }
  .minimap {
    width: 112px; height: 44px; flex: 0 0 112px; border-radius: 12px; overflow: hidden; position: relative;
    border: 3px solid var(--ink); background: #fff;
  }
  .minimap .sky { position: absolute; left: 0; right: 0; top: 0; height: 62%; }
  .minimap .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 38%; }
  .minimap .view { position: absolute; top: 4px; bottom: 4px; width: 42%; left: 28%; border: 2px solid var(--ink); border-radius: 4px; }
  .tools { margin-left: auto; display: flex; gap: 6px; }
  .round {
    width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 3px solid var(--ink);
    box-shadow: 0 4px 0 #e6c9d8; display: grid; place-items: center; padding: 8px;
  }
  .round.map { background: #fff3b0; }
  .round svg { width: 100%; height: 100%; }
  .stageWrap { position: relative; flex: 1; min-height: 0; }
  .stage {
    position: absolute; left: 50%; top: 50%; width: 1000px; height: 600px;
    transform: translate(-50%, -50%);
    border-radius: 28px; overflow: hidden; border: 6px solid var(--ink);
    box-shadow: 0 10px 0 rgba(90,61,92,.25); background: #fff;
  }
  .stage svg.scene { width: 100%; height: 100%; display: block; }
  .nudge {
    position: absolute; top: 50%; width: 36px; height: 56px; margin-top: -28px; border-radius: 16px;
    background: rgba(255,255,255,.86); border: 3px solid var(--ink); display: grid; place-items: center;
  }
  .nudge.l { left: 8px; } .nudge.r { right: 8px; }
  .nudge svg { width: 22px; height: 22px; }
  .hint {
    position: absolute; transform: translateX(-50%); background: #fff; border: 3px solid var(--ink);
    border-radius: 14px; padding: 3px 12px; font-weight: 900; font-size: 18px; white-space: nowrap;
    box-shadow: 0 3px 0 rgba(90,61,92,.25); z-index: 2;
  }
  .drawer { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
  .drawerTop { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .mode {
    display: flex; gap: 2px; background: #fff; border: 3px solid #e6c9d8; border-radius: 16px; padding: 3px; height: 48px;
  }
  .mode button {
    display: flex; align-items: center; gap: 4px; height: 38px; padding: 0 10px; border-radius: 12px;
    font-weight: 800; font-size: 15px; border: 3px solid transparent;
  }
  .mode button.on { background: #fff3b0; border-color: var(--ink); }
  .mode svg { width: 22px; height: 22px; }
  .cats { display: flex; gap: 6px; min-width: 0; overflow: hidden; }
  .cat {
    width: 46px; height: 46px; border-radius: 14px; background: #fff; border: 3px solid transparent;
    box-shadow: 0 3px 0 #e6c9d8; display: grid; place-items: center; flex: 0 0 auto;
  }
  .cat.on { border-color: var(--ink); background: #fff3b0; }
  .cat svg { width: 32px; height: 32px; }
  .cat.pack { width: auto; padding: 0 8px; font-weight: 800; font-size: 13px; gap: 4px; display: flex; }
  .shelf {
    height: 108px; display: flex; gap: 10px; overflow: hidden; padding: 8px 10px;
    background: rgba(255,255,255,.72); border-radius: 22px; border: 4px solid var(--ink);
  }
  .thing {
    flex: 0 0 86px; height: 86px; background: #fff; border-radius: 18px; box-shadow: 0 4px 0 #e6c9d8;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  }
  .thing svg { width: 52px; height: 46px; }
  .thing span { font-size: 11px; font-weight: 800; line-height: 1.05; text-align: center; max-width: 80px; }
  body[data-shot="play"] .shelf, body[data-shot="play"] .cats, body[data-shot="door"] .shelf, body[data-shot="door"] .cats { display: none; }
  body.phone .tab { font-size: 13px; padding: 0 4px; min-height: 44px; flex: 1 1 auto; justify-content: center; }
  body.phone .tabs { flex: 1 0 100%; order: 0; gap: 3px; }
  body.phone .top { flex-wrap: wrap; gap: 4px; padding-bottom: 2px; }
  body.phone .minimap { flex: 1 1 auto; width: auto; order: 2; }
  body.phone .tools { order: 2; margin-left: auto; }
  body.phone[data-shot="play"] .minimap, body.phone[data-shot="door"] .minimap { display: none; }
  body.phone .mode { height: 44px; }
  body.phone .mode button { height: 34px; font-size: 14px; padding: 0 8px; }
  body.phone .cat { width: 44px; height: 44px; }
  body.phone .shelf { height: 86px; padding: 6px; gap: 6px; }
  body.phone .thing { flex-basis: 68px; height: 70px; }
  body.phone .thing svg { width: 40px; height: 34px; }
  body.phone .thing span { font-size: 8px; }
  body.phone .hint { font-size: 14px; padding: 2px 8px; }
  body.phone .stage { border-width: 4px; border-radius: 20px; }
</style>
</head>
<body>
<div id="app">
  <div class="top" id="top"></div>
  <div class="stageWrap"><div class="stage" id="stage"></div></div>
  <div class="drawer" id="drawer"></div>
</div>
<script>
var INK = '#5a3d5c';
var shot = 'play';
try { shot = new URLSearchParams(location.search).get('shot') || 'play'; } catch (e) {}
if (shot !== 'decorate' && shot !== 'door') shot = 'play';
document.body.dataset.shot = shot;
if (window.innerWidth < 500) document.body.classList.add('phone');
var phone = document.body.classList.contains('phone');

function el(html) {
  var d = document.createElement('div');
  d.innerHTML = html;
  return d.firstElementChild;
}
function svg(inner, vb) {
  return '<svg viewBox="' + (vb || '0 0 48 48') + '" aria-hidden="true">' + inner + '</svg>';
}
var s = 'stroke="' + INK + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none"';

var menuIco = svg('<rect x="8" y="12" width="32" height="5" rx="2.5" fill="' + INK + '"/><rect x="8" y="22" width="32" height="5" rx="2.5" fill="' + INK + '"/><rect x="8" y="32" width="22" height="5" rx="2.5" fill="' + INK + '"/>');
var mapIco = svg('<path d="M8 12 L20 8 L32 14 L42 8 V36 L30 40 L18 34 L8 40 Z" fill="#fff6e6" ' + s + '/><path d="M20 8 V36 M32 14 V40" ' + s + '/>');
var handIco = svg('<path d="M18 22 V12 a3 3 0 0 1 6 0 V22" fill="#fff6e6" ' + s + '/><path d="M24 22 V10 a3 3 0 0 1 6 0 V24" fill="#fff6e6" ' + s + '/><path d="M30 24 V14 a3 3 0 0 1 6 0 V26" fill="#fff6e6" ' + s + '/><path d="M14 22 V16 a3 3 0 0 0-6 0 V28 c0 8 6 14 16 14 h4 c8 0 12-5 12-12 V26" fill="#ffe0b8" ' + s + '/>');
var brushIco = svg('<path d="M10 34 L22 22 L30 30 L18 42 Q10 42 10 34 Z" fill="#ff8fab" ' + s + '/><path d="M22 22 L32 12 L38 18 L28 28 Z" fill="#ffd166" ' + s + '/>');
var chairIco = svg('<rect x="14" y="8" width="20" height="16" rx="6" fill="#90e0a8" ' + s + '/><rect x="12" y="24" width="24" height="6" rx="3" fill="#5cc985" ' + s + '/><path d="M16 30 V40 M32 30 V40" ' + s + '/>');
var balloonIco = svg('<ellipse cx="18" cy="18" rx="8" ry="10" fill="#ff8fab" ' + s + '/><ellipse cx="30" cy="16" rx="8" ry="10" fill="#a2d2ff" ' + s + '/><path d="M18 28 Q24 36 24 44 M30 26 Q24 36 24 44" ' + s + '/>');
var flowerIco = svg('<circle cx="24" cy="20" r="6" fill="#ff8fab" ' + s + '/><circle cx="16" cy="26" r="5" fill="#ffd166" ' + s + '/><circle cx="32" cy="26" r="5" fill="#a2d2ff" ' + s + '/><path d="M24 32 V44" ' + s + '/>');
var donutIco = svg('<circle cx="24" cy="24" r="14" fill="#ff8fab" ' + s + '/><circle cx="24" cy="24" r="5" fill="#fff" ' + s + '/>');
var catIco = svg('<path d="M16 20 L14 8 L22 16 M32 20 L34 8 L26 16" fill="#ffb347" ' + s + '/><circle cx="24" cy="24" r="12" fill="#ffc46b" ' + s + '/>');

var tabs = phone
  ? [['Living', false], ['Bed', false], ['Kitchen', false], ['Salon', false], ['Nursery', false]]
  : [['Living Room', shot === 'door'], ['Bedroom', false], ['Kitchen', false], ['Salon', false], ['Nursery', false]];
if (!phone && shot !== 'door') tabs[0][1] = false;
if (phone && shot === 'door') tabs[0][1] = true;

var tabHtml = tabs.map(function (t) {
  return '<button class="tab' + (t[1] ? ' on' : '') + '">' + t[0] + '</button>';
}).join('');

var sky = shot === 'door' ? '#ffd6e0' : '#c5ecff';
var ground = shot === 'door' ? '#e8b98a' : '#8ed98a';
var mini = '<div class="minimap" aria-hidden="true"><div class="sky" style="background:' + sky + '"></div><div class="ground" style="background:' + ground + '"></div><div class="view"></div></div>';
document.getElementById('top').innerHTML = '<div class="tabs">' + tabHtml + '</div>' + mini +
  '<div class="tools"><button class="round" aria-label="Menu">' + menuIco + '</button><button class="round map" aria-label="Map">' + mapIco + '</button></div>';

var nudges = '<button class="nudge l" aria-label="Look left"><svg viewBox="0 0 40 40"><path d="M24 10 L14 20 L24 30" fill="none" stroke="' + INK + '" stroke-width="5" stroke-linecap="round"/></svg></button>' +
  '<button class="nudge r" aria-label="Look right"><svg viewBox="0 0 40 40"><path d="M16 10 L26 20 L16 30" fill="none" stroke="' + INK + '" stroke-width="5" stroke-linecap="round"/></svg></button>';

function kid(x, y, flip) {
  var t = flip ? ' scale(-1 1)' : '';
  return '<g transform="translate(' + x + ' ' + y + ')' + t + '">' +
    '<ellipse cx="0" cy="118" rx="28" ry="6" fill="#000" opacity=".12"/>' +
    '<path d="M-22 40 L-8 8 H8 L22 40 Z" fill="#ff7aa8" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M-16 46 H16 V108 H-16 Z" fill="#ff8fab" stroke="' + INK + '" stroke-width="3"/>' +
    '<path d="M-16 70 H16 V112 H-16 Z" fill="#5aa9e6" stroke="' + INK + '" stroke-width="3"/>' +
    '<circle cx="0" cy="0" r="26" fill="#f1c27d" stroke="' + INK + '" stroke-width="3"/>' +
    '<path d="M-24 -6 Q-18 -34 0 -28 Q18 -34 24 -6 Q10 -18 -10 -16 Q-20 -8 -24 -6" fill="#5b3a29" stroke="' + INK + '" stroke-width="3"/>' +
    '<circle cx="-8" cy="2" r="2.4" fill="' + INK + '"/><circle cx="8" cy="2" r="2.4" fill="' + INK + '"/>' +
    '<path d="M-6 12 q6 6 12 0" fill="none" stroke="' + INK + '" stroke-width="2.4" stroke-linecap="round"/>' +
    '<ellipse cx="-14" cy="10" rx="4" ry="2.4" fill="#ff9bb5" opacity=".8"/><ellipse cx="14" cy="10" rx="4" ry="2.4" fill="#ff9bb5" opacity=".8"/>' +
    '</g>';
}
function dog(x, y) {
  return '<g transform="translate(' + x + ' ' + y + ')">' +
    '<ellipse cx="0" cy="36" rx="26" ry="8" fill="#000" opacity=".1"/>' +
    '<ellipse cx="8" cy="10" rx="22" ry="16" fill="#fff" stroke="' + INK + '" stroke-width="3"/>' +
    '<circle cx="22" cy="-8" r="12" fill="#fff" stroke="' + INK + '" stroke-width="3"/>' +
    '<ellipse cx="12" cy="-10" rx="5" ry="10" fill="#b07d54" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<circle cx="26" cy="-10" r="1.8" fill="' + INK + '"/><ellipse cx="30" cy="-4" rx="3" ry="2" fill="' + INK + '"/>' +
    '<path d="M-16 8 q-10 8 -4 16" fill="none" stroke="' + INK + '" stroke-width="3" stroke-linecap="round"/>' +
    '</g>';
}
function cat(x, y) {
  return '<g transform="translate(' + x + ' ' + y + ')">' +
    '<ellipse cx="0" cy="28" rx="20" ry="7" fill="#000" opacity=".1"/>' +
    '<ellipse cx="6" cy="8" rx="18" ry="14" fill="#ffb347" stroke="' + INK + '" stroke-width="3"/>' +
    '<circle cx="16" cy="-6" r="11" fill="#ffc46b" stroke="' + INK + '" stroke-width="3"/>' +
    '<path d="M8 -12 L6 -22 L16 -14 M24 -12 L26 -22 L16 -14" fill="#ffb347" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<circle cx="13" cy="-6" r="1.6" fill="' + INK + '"/><circle cx="20" cy="-6" r="1.6" fill="' + INK + '"/>' +
    '</g>';
}
function swing(x, y, sel) {
  var glow = sel ? '<rect x="-70" y="-150" width="140" height="200" rx="18" fill="none" stroke="#ffd166" stroke-width="8"/>' : '';
  return '<g transform="translate(' + x + ' ' + y + ')">' + glow +
    '<path d="M-46 -120 L-62 20 M-46 -120 L-30 20 M46 -120 L30 20 M46 -120 L62 20" stroke="' + INK + '" stroke-width="7" stroke-linecap="round"/>' +
    '<path d="M-46 -120 L-62 20 M-46 -120 L-30 20 M46 -120 L30 20 M46 -120 L62 20" stroke="#8ecae6" stroke-width="3" stroke-linecap="round"/>' +
    '<rect x="-58" y="-132" width="116" height="16" rx="8" fill="#ff8fab" stroke="' + INK + '" stroke-width="3"/>' +
    '<path d="M-46 -116 V-20 M46 -116 V-20" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<rect x="-62" y="-24" width="32" height="10" rx="4" fill="#ffd166" stroke="' + INK + '" stroke-width="3"/>' +
    '<rect x="30" y="-24" width="32" height="10" rx="4" fill="#ffd166" stroke="' + INK + '" stroke-width="3"/>' +
    '</g>';
}
function sandbox(x, y) {
  return '<g transform="translate(' + x + ' ' + y + ')">' +
    '<rect x="-50" y="-28" width="100" height="36" rx="8" fill="#f4d35e" stroke="' + INK + '" stroke-width="3"/>' +
    '<rect x="-44" y="-22" width="88" height="22" rx="6" fill="#ffe08a"/>' +
    '<path d="M16 -34 l8 -16 h8 l-4 16" fill="#ff8fab" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<circle cx="-20" cy="-8" r="6" fill="#8ecae6" stroke="' + INK + '" stroke-width="2"/>' +
    '</g>';
}
function flowers(x, y) {
  var bits = '';
  var cols = ['#ff8fab', '#ffd166', '#c9a0dc', '#ff8fab', '#8ecae6'];
  for (var i = 0; i < 5; i++) {
    bits += '<circle cx="' + (i * 16 - 32) + '" cy="-18" r="8" fill="' + cols[i] + '" stroke="' + INK + '" stroke-width="2"/>' +
      '<path d="M' + (i * 16 - 32) + ' -10 V8" stroke="#3d9a62" stroke-width="2"/>';
  }
  return '<g transform="translate(' + x + ' ' + y + ')">' + bits +
    '<ellipse cx="0" cy="12" rx="46" ry="10" fill="#6fbf73" stroke="' + INK + '" stroke-width="3"/></g>';
}
function cart(x, y) {
  return '<g transform="translate(' + x + ' ' + y + ')">' +
    '<rect x="-36" y="-48" width="72" height="40" rx="8" fill="#fff6e6" stroke="' + INK + '" stroke-width="3"/>' +
    '<path d="M-28 -48 V-70 H28 V-48" fill="#ffd166" stroke="' + INK + '" stroke-width="3"/>' +
    '<text x="0" y="-56" text-anchor="middle" font-size="11" font-weight="800" fill="' + INK + '" font-family="Nunito, system-ui, sans-serif">sip</text>' +
    '<circle cx="-22" cy="4" r="8" fill="#fff" stroke="' + INK + '" stroke-width="3"/><circle cx="22" cy="4" r="8" fill="#fff" stroke="' + INK + '" stroke-width="3"/>' +
    '<rect x="-8" y="-40" width="14" height="18" rx="3" fill="#ffe066" stroke="' + INK + '" stroke-width="2"/>' +
    '</g>';
}
function pool(x, y) {
  return '<g transform="translate(' + x + ' ' + y + ')">' +
    '<ellipse cx="0" cy="0" rx="46" ry="16" fill="#8ecae6" stroke="' + INK + '" stroke-width="3"/>' +
    '<ellipse cx="0" cy="-4" rx="34" ry="10" fill="#cdeffd"/>' +
    '<path d="M-16 -6 q8 6 16 0 q8 6 16 0" fill="none" stroke="#fff" stroke-width="3"/>' +
    '</g>';
}
function door(x, y, outdoor) {
  var leaf = outdoor
    ? '<path d="M-46 -150 L0 -196 L46 -150" fill="#ff8fab" stroke="' + INK + '" stroke-width="3"/>' +
      '<rect x="-40" y="-150" width="80" height="150" rx="6" fill="#fff6ea" stroke="' + INK + '" stroke-width="3"/>' +
      '<rect x="-22" y="-70" width="44" height="70" rx="6" fill="#d8b48a" stroke="' + INK + '" stroke-width="3"/>' +
      '<rect x="-14" y="-60" width="28" height="22" rx="3" fill="#bfe6ff" stroke="' + INK + '" stroke-width="2"/>' +
      '<circle cx="12" cy="-32" r="3" fill="#ffd166"/>'
    : '<path d="M-78 -168 L0 -230 L78 -168" fill="#ff8fab" stroke="' + INK + '" stroke-width="4"/>' +
      '<rect x="-64" y="-168" width="128" height="168" fill="#fff6ea" stroke="' + INK + '" stroke-width="4"/>' +
      '<rect x="-22" y="-78" width="44" height="78" rx="6" fill="#c9a0dc" stroke="' + INK + '" stroke-width="3"/>' +
      '<rect x="-14" y="-128" width="28" height="24" rx="3" fill="#bfe6ff" stroke="' + INK + '" stroke-width="2"/>' +
      '<circle cx="10" cy="-40" r="3" fill="#ffd166"/>';
  return '<g transform="translate(' + x + ' ' + y + ')">' + leaf + '</g>';
}

function fence(W) {
  var p = '';
  var n = Math.ceil(W / 54);
  for (var i = 0; i < n; i++) {
    var x = 8 + i * 54;
    p += '<path d="M' + x + ' 390 V332 l16 -18 l16 18 V390 Z" fill="#fff6e6" stroke="' + INK + '" stroke-width="3"/>';
  }
  return p;
}
function yardScene(W) {
  var sel = shot === 'decorate';
  var wide = W > 700;
  return '<svg class="scene" viewBox="0 0 ' + W + ' 600">' +
    '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd6ff"/><stop offset="1" stop-color="#e7f6ff"/></linearGradient></defs>' +
    '<rect width="' + W + '" height="390" fill="url(#sky)"/>' +
    '<circle cx="' + (W - 90) + '" cy="78" r="34" fill="#ffe066" stroke="' + INK + '" stroke-width="4"/>' +
    '<g fill="#fff" stroke="' + INK + '" stroke-width="3"><ellipse cx="70" cy="86" rx="46" ry="18"/><ellipse cx="100" cy="74" rx="24" ry="14"/>' +
    (wide ? '<ellipse cx="520" cy="96" rx="60" ry="22"/><ellipse cx="560" cy="82" rx="30" ry="16"/>' : '') + '</g>' +
    fence(W) +
    '<rect y="378" width="' + W + '" height="222" fill="#8ed98a"/>' +
    '<path d="M0 490 Q' + (W / 2) + ' 450 ' + W + ' 486 V600 H0 Z" fill="#b6e3a8"/>' +
    door(100, 390, false) +
    swing(wide ? 390 : 200, 400, sel) +
    sandbox(wide ? 680 : 455, 530) +
    flowers(wide ? 230 : 300, 555) +
    (wide ? cart(880, 495) + pool(560, 575) : '') +
    kid(wide ? 560 : 360, 455, false) +
    dog(wide ? 680 : 450, 520) +
    cat(wide ? 200 : 250, 530) +
    '</svg>' +
    '<div class="hint" style="left:' + (100 / W * 100) + '%; top:46%;">Back inside</div>';
}
function livingScene(W) {
  var wide = W > 700;
  var doorX = W - 120;
  return '<svg class="scene" viewBox="0 0 ' + W + ' 600">' +
    '<rect width="' + W + '" height="390" fill="#ffd6e0"/>' +
    '<g fill="#ffb3c6" opacity=".55">' + dots(W) + '</g>' +
    '<rect y="390" width="' + W + '" height="210" fill="#e8b98a"/>' +
    '<g stroke="rgba(90,61,92,.18)" stroke-width="3">' + boards(W) + '</g>' +
    '<rect y="374" width="' + W + '" height="16" fill="#fff" stroke="' + INK + '" stroke-width="4"/>' +
    (wide ? '<rect x="70" y="150" width="150" height="150" rx="16" fill="#ffd166" stroke="' + INK + '" stroke-width="4"/>' +
      '<rect x="86" y="166" width="118" height="118" rx="8" fill="#bde0fe"/>' +
      '<path d="M86 284 L130 220 L160 250 L180 230 L204 284 Z" fill="#90e0a8" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="168" cy="196" r="14" fill="#fff3b0"/>' : '') +
    '<rect x="' + (wide ? 250 : 40) + '" y="300" width="250" height="110" rx="26" fill="#ff8fab" stroke="' + INK + '" stroke-width="4"/>' +
    '<rect x="' + (wide ? 280 : 70) + '" y="274" width="190" height="64" rx="18" fill="#ffb3c6" stroke="' + INK + '" stroke-width="4"/>' +
    '<rect x="' + (wide ? 250 : 40) + '" y="328" width="58" height="100" rx="18" fill="#ff7096" stroke="' + INK + '" stroke-width="4"/>' +
    '<rect x="' + (wide ? 442 : 232) + '" y="328" width="58" height="100" rx="18" fill="#ff7096" stroke="' + INK + '" stroke-width="4"/>' +
    '<ellipse cx="' + (wide ? 400 : 180) + '" cy="530" rx="120" ry="24" fill="#ffc8dd" stroke="' + INK + '" stroke-width="4"/>' +
    door(doorX, 390, true) +
    '<rect x="' + (doorX - 36) + '" y="300" width="28" height="16" rx="4" fill="#ff8fab" stroke="' + INK + '" stroke-width="2"/>' +
    '<circle cx="' + (doorX - 22) + '" cy="292" r="8" fill="#ffd166" stroke="' + INK + '" stroke-width="2"/>' +
    kid(wide ? 620 : 300, 450, true) +
    '</svg>' +
    '<div class="hint" style="left:' + (doorX / W * 100) + '%; top:42%;">Backyard</div>';
}
function dots(W) {
  var p = '';
  for (var y = 30; y < 360; y += 44) for (var x = 20; x < W; x += 44) p += '<circle cx="' + x + '" cy="' + y + '" r="5"/>';
  return p;
}
function boards(W) {
  var p = '';
  for (var x = 0; x <= W; x += 80) p += '<path d="M' + x + ' 390 V600"/>';
  return p;
}

var viewW = phone ? 520 : 1000;
document.getElementById('stage').innerHTML = (shot === 'door' ? livingScene(viewW) : yardScene(viewW)) + nudges;
function fitStage() {
  var wrap = document.querySelector('.stageWrap').getBoundingClientRect();
  var sc = Math.min(wrap.width / viewW, wrap.height / 600);
  if (!isFinite(sc) || sc <= 0) sc = 0.5;
  var stage = document.getElementById('stage');
  stage.style.width = Math.floor(viewW * sc) + 'px';
  stage.style.height = Math.floor(600 * sc) + 'px';
}

var shelfItems = [
  ['A-Frame Swing', swingIcon()],
  ['Sandbox', boxIcon('#f4d35e')],
  ['Little Slide', slideIcon()],
  ['Garden Bench', benchIcon()],
  ['Lemonade Cart', cartIcon()],
  ['Sun Lounger', loungerIcon()],
  ['Splash Pool', poolIcon()],
  ['Picket Gate', gateIcon()],
  ['Greenhouse', houseIcon()],
  ['Fire Pit', pitIcon()]
];
function swingIcon() { return svg('<path d="M10 40 L16 14 H32 L38 40" stroke="' + INK + '" stroke-width="3" fill="none"/><rect x="8" y="10" width="32" height="6" rx="3" fill="#ff8fab" ' + s + '/><rect x="12" y="30" width="8" height="4" fill="#ffd166"/>'); }
function boxIcon(c) { return svg('<rect x="8" y="20" width="32" height="16" rx="4" fill="' + c + '" ' + s + '/>'); }
function slideIcon() { return svg('<path d="M14 10 V28 H34 L18 40" stroke="' + INK + '" stroke-width="3" fill="none"/><path d="M18 28 H36 L22 42 H10 Z" fill="#8ecae6" ' + s + '/>'); }
function benchIcon() { return svg('<rect x="8" y="18" width="32" height="8" rx="3" fill="#ff9f68" ' + s + '/><rect x="8" y="30" width="32" height="6" rx="3" fill="#ffb385" ' + s + '/><path d="M12 36 V42 M36 36 V42" ' + s + '/>'); }
function cartIcon() { return svg('<rect x="10" y="16" width="28" height="16" rx="3" fill="#fff6e6" ' + s + '/><path d="M14 16 V10 H34 V16" fill="#ffd166" ' + s + '/><circle cx="16" cy="38" r="4" fill="#fff" ' + s + '/><circle cx="32" cy="38" r="4" fill="#fff" ' + s + '/>'); }
function loungerIcon() { return svg('<path d="M8 34 L40 22" stroke="#ff8fab" stroke-width="8" stroke-linecap="round"/><path d="M10 34 L42 22" stroke="' + INK + '" stroke-width="2" fill="none"/>'); }
function poolIcon() { return svg('<ellipse cx="24" cy="28" rx="16" ry="8" fill="#8ecae6" ' + s + '/>'); }
function gateIcon() { return svg('<path d="M14 40 V16 h8 v24 M26 40 V16 h8 v24" fill="#fff6e6" ' + s + '/>'); }
function houseIcon() { return svg('<path d="M10 28 L24 14 L38 28 V40 H10 Z" fill="#c9f0d8" ' + s + '/>'); }
function pitIcon() { return svg('<ellipse cx="24" cy="30" rx="14" ry="6" fill="#c99366" ' + s + '/><path d="M20 28 q4 -10 8 0" fill="#ff922b" stroke="' + INK + '" stroke-width="2"/>'); }

var playOn = shot !== 'decorate';
var cats = playOn ? '' : (
  '<div class="cats">' +
  '<button class="cat" aria-label="People">' + svg('<circle cx="18" cy="16" r="6" fill="#ffd166" ' + s + '/><circle cx="30" cy="18" r="5" fill="#ff8fab" ' + s + '/>') + '</button>' +
  '<button class="cat on" aria-label="Furniture">' + chairIco + '</button>' +
  '<button class="cat" aria-label="Decor">' + balloonIco + '</button>' +
  '<button class="cat" aria-label="Plants">' + flowerIco + '</button>' +
  '<button class="cat" aria-label="Food">' + donutIco + '</button>' +
  '<button class="cat" aria-label="Pets">' + catIco + '</button>' +
  '<button class="cat pack" aria-label="Cottage">Cottage</button>' +
  '</div>'
);
var shelf = '';
if (!playOn) {
  var n = phone ? 4 : 8;
  shelf = '<div class="shelf">' + shelfItems.slice(0, n).map(function (it) {
    return '<div class="thing">' + it[1] + '<span>' + it[0] + '</span></div>';
  }).join('') + '</div>';
}
document.getElementById('drawer').innerHTML =
  '<div class="drawerTop"><div class="mode">' +
  '<button class="' + (playOn ? 'on' : '') + '" aria-label="Play">' + handIco + '<span>Play</span></button>' +
  '<button class="' + (playOn ? '' : 'on') + '" aria-label="Decorate">' + brushIco + '<span>Decorate</span></button>' +
  '</div>' + cats + '</div>' + shelf;
fitStage();
</script>
