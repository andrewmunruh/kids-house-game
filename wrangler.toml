# Neighborhood server on Cloudflare (Workers Free plan is enough for a handful of kids).
# Deploy: npx wrangler login && npx wrangler deploy
name = "cozy-hood"
main = "server/worker.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# lock the API to the game's origin (GitHub Pages); "*" while testing locally
ALLOWED_ORIGIN = "https://andrewmunruh.github.io"

[[durable_objects.bindings]]
name = "HOOD"
class_name = "HoodDO"

[[durable_objects.bindings]]
name = "CODES"
class_name = "CodeRegistryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HoodDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CodeRegistryDO"]

[observability]
enabled = false

# ---------- PREVIEW server (separate Worker + separate Durable Objects: preview streets never mix with the kids' data) ----------
# Deploy: npx wrangler deploy --env preview   ->  https://cozy-hood-preview.andrewmunruh.workers.dev
[env.preview]
name = "cozy-hood-preview"
workers_dev = true

[env.preview.vars]
ALLOWED_ORIGIN = "https://andrewmunruh.github.io"

[[env.preview.durable_objects.bindings]]
name = "HOOD"
class_name = "HoodDO"

[[env.preview.durable_objects.bindings]]
name = "CODES"
class_name = "CodeRegistryDO"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["HoodDO"]

[[env.preview.migrations]]
tag = "v2"
new_sqlite_classes = ["CodeRegistryDO"]
